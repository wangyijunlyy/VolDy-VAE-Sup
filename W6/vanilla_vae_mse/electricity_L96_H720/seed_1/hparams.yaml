_instantiator: lightning.pytorch.cli.instantiate_module
batch_size: 64
data_manager:
  class_path: probts.DataManager
  init_args:
    auto_search: false
    context_length: 96
    context_length_factor: 1
    continuous_sample: false
    data_path: null
    dataset: electricity_ltsf
    freq: null
    history_length: null
    multivariate: true
    path: ./datasets
    prediction_length: 720
    scaler: standard
    split_val: true
    test_ratio: 0.2
    test_rolling_length: 96
    timeenc: 1
    train_ctx_len: null
    train_pred_len_list: null
    train_ratio: 0.7
    val_ctx_len: null
    val_pred_len_list: null
    var_specific_norm: true
forecaster:
  class_path: probts.model.forecaster.prob_forecaster.gaussian_vae_mse.GaussianVAE_MSE_Model
  init_args:
    activation: relu
    autoregressive: false
    context_length: null
    d_ff: 256
    d_model: 128
    dataset: null
    dropout: 0.1
    dynamic_dim: 128
    e_layers: 1
    factor: 3
    feat_idx_emb_dim: 1
    freq: null
    hidden_dim: 256
    hidden_layers: 3
    init_kalman: identity
    init_koopman: dynamic
    lags_list: null
    multistep: true
    n_heads: 4
    no_training: false
    patch_len: 24
    prediction_length: null
    sample_schedule: 20
    target_dim: null
    time_feat_dim: 1
    use_feat_idx_emb: false
    use_lags: false
    use_scaling: false
    use_time_feat: false
    weight_beta: 0.01
learning_rate: 0.001
load_from_ckpt: null
lr_scheduler_config: null
num_samples: 100
num_workers: 8
optimizer_config: null
quantiles_num: 20
sampling_weight_scheme: none
test_batch_size: 32
